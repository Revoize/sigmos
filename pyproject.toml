[project]
name = "sigmos"
version = "0.0.1"
description = "Audio quality evaluation using SIGMOS metric"
authors = [
    {name = "Revoize", email = "matt@revoize.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.10.2",
    "numpy>=2.1.0",
    "onnxruntime>=1.20.0",
    "scipy>=1.14.1",
    "soundfile>=0.12.1",
    "typer>=0.15.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.0,<8.0.0",
    "darglint>=1.8.1,<2.0.0",
    "poethepoet>=0.46.0,<0.47.0",
    "pre-commit>=4.6.0,<5.0.0",
    "pytest>=9.0.2,<10.0.0",
    "ruff>=0.15.13,<0.16.0",
    "rumdl==0.2.42",
]
[project.scripts]
sigmos = "sigmos.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatchling.build.targets.wheel.shared-data]
"sigmos/models" = ["*.onnx"]

[tool.uv]
add-bounds = "lower"

# Fleet-standard markdown config. These blocks are kept identical across every
# Revoize repo; the reference copy — and the per-rule rationale behind each
# value — lives in the dev harness repo's root pyproject.toml. Diff against that
# before changing anything here, and propagate rather than diverge.
[tool.rumdl]
disable = ["MD036"]
unfixable = ["MD040"]

[tool.rumdl.MD013]
line-length = 100
reflow = true
tables = true
code-blocks = false

[tool.rumdl.MD024]
siblings-only = true

[tool.rumdl.MD060]
enabled = true
style = "aligned"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "B",
    "A001",
    "C4",
    "D",
    "ERA",
    "I",
    "N",
    "S",
]

ignore = [
    "D104",   # Missing docstring in public package
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D106",   # Missing docstring in public nested class
    "D203",   # Incompatible with D211 (Google style - no blank line before class)
    "D212",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # Allow assert statements in tests (security check)
"sigmos/cli.py" = ["B008"]  # Function calls in argument defaults (typer.Argument, typer.Option)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.isort]
known-first-party = ["sigmos"]
force-single-line = false
force-wrap-aliases = false

[tool.poe]
envfile = ".env"

[tool.poe.tasks]
configure = "./scripts/configure.sh"
update = "./scripts/update.sh"
lint-fix = "ruff check --fix ."
format-check = "ruff format --check ."
lint-md = "rumdl check ."
format-md = "rumdl fmt ."
test = 'coverage run -m pytest --showlocals'
coverage = "coverage report"
hooks-run = "pre-commit run --all-files"
hooks-update = "pre-commit autoupdate"

[tool.poe.tasks.lint]
help = "Lint Python with ruff and markdown with rumdl (the CI gate)"
sequence = [
    { cmd = "ruff check ." },
    { cmd = "rumdl check ." },
]

[tool.poe.tasks.format]
help = "Auto-fix Python with ruff and markdown with rumdl"
sequence = [
    { cmd = "ruff format ." },
    { cmd = "rumdl fmt ." },
]
